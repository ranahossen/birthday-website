<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7, #c9b6ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 900px;
            min-height: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card h1 {
            font-size: 65px;
            color: #ff2e72;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #ffd1df;
        }

        .card h2 {
            font-size: 35px;
            color: #663399;
            margin-bottom: 20px;
        }

        .message {
            font-size: 20px;
            line-height: 1.8;
            color: #555;
            max-width: 700px;
            margin: auto;
        }

        .cake {
            font-size: 120px;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        .wish-btn {
            margin-top: 25px;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff2e72, #ff6b9a);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(255, 46, 114, 0.3);
        }

        .wish-btn:hover {
            transform: scale(1.08);
        }

        #surprise {
            margin-top: 25px;
            color: #ff2e72;
            font-size: 22px;
            font-weight: bold;
            display: none;
        }

        /* Balloons */

        .balloon {
            position: absolute;
            width: 70px;
            height: 90px;
            border-radius: 50%;
            bottom: -120px;
            animation: fly 8s linear infinite;
        }

        .balloon::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 120px;
            background: #777;
            top: 85px;
            left: 50%;
        }

        .balloon1 {
            background: #ff477e;
            left: 5%;
            animation-delay: 0s;
        }

        .balloon2 {
            background: #4dabf7;
            left: 25%;
            animation-delay: 2s;
        }

        .balloon3 {
            background: #ffd43b;
            right: 25%;
            animation-delay: 1s;
        }

        .balloon4 {
            background: #69db7c;
            right: 5%;
            animation-delay: 3s;
        }

        @keyframes fly {
            0% {
                bottom: -120px;
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(5deg);
            }

            100% {
                bottom: 110%;
                transform: rotate(-5deg);
            }
        }

        /* Hearts */

        .heart {
            position: absolute;
            color: #ff2e72;
            font-size: 30px;
            animation: heartFloat 4s infinite ease-in-out;
        }

        .heart1 {
            top: 15%;
            left: 10%;
        }

        .heart2 {
            top: 25%;
            right: 10%;
            animation-delay: 1s;
        }

        .heart3 {
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
        }

        .heart4 {
            bottom: 20%;
            right: 15%;
            animation-delay: 1.5s;
        }

        @keyframes heartFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-20px) scale(1.2);
            }
        }

        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 15px;
        }

        @media (max-width: 600px) {

            .card {
                padding: 30px 20px;
            }

            .card h1 {
                font-size: 42px;
            }

            .card h2 {
                font-size: 25px;
            }

            .message {
                font-size: 17px;
            }

            .cake {
                font-size: 85px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Balloons -->
        <div class="balloon balloon1"></div>
        <div class="balloon balloon2"></div>
        <div class="balloon balloon3"></div>
        <div class="balloon balloon4"></div>

        <!-- Hearts -->
        <div class="heart heart1">❤️</div>
        <div class="heart heart2">💖</div>
        <div class="heart heart3">💕</div>
        <div class="heart heart4">❤️</div>

        <h1>🎉 শুভ জন্মদিন! 🎉</h1>

        <h2>Dear Someone Special ❤️</h2>

        <div class="cake">
            🎂
        </div>

        <p class="message">
            
            তোমার জন্মদিনটি সুখ, ভালোবাসা,
            সুন্দর মুহূর্ত আর অবিস্মরণীয় স্মৃতিতে ভরে উঠুক...
             ✨
        </p>

        <button class="wish-btn" onclick="showSurprise()">
            💝 Click For A Surprise
        </button>

        <div id="surprise">
           
             <p> 🌸<br>
                <br> তোমার সব স্বপ্ন পূরণ হোক,<br>
                 আর জীবনে সবসময় সুখী হও। ✨ </p> 
    </div>


    <script>
        function showSurprise() {
            const surprise = document.getElementById("surprise");

            surprise.style.display = "block";

            createConfetti();
        }


        function createConfetti() {

            for (let i = 0; i < 100; i++) {

                const confetti = document.createElement("div");

                confetti.innerHTML = "🎉";

                confetti.style.position = "fixed";
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.top = "-30px";
                confetti.style.fontSize = Math.random() * 20 + 10 + "px";
                confetti.style.zIndex = "9999";

                document.body.appendChild(confetti);

                const duration = Math.random() * 3 + 2;

                confetti.animate(
                    [
                        {
                            transform: "translateY(0) rotate(0deg)",
                            opacity: 1
                        },
                        {
                            transform:
                                `translateY(110vh) rotate(${Math.random() * 720}deg)`,
                            opacity: 0
                        }
                    ],
                    {
                        duration: duration * 1000,
                        easing: "linear"
                    }
                );

                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000);
            }
        }
    </script>

</body>
</html>
