<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome 💕</title>
    <meta name="description" content="A cinematic 3D heart tunnel anniversary reveal experience.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Dancing+Script:wght@600;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style4.css">
</head>

<body>

    
    <div id="start-overlay">
        <div class="start-card">
            <div class="start-heart">💖</div>
            <h1 class="start-title">
                <span class="start-title-sub">Welcome</span>
                <span class="start-title-main"> Special Surprise <br>For You</span>
            </h1>
            <button id="start-btn" class="glow-btn">
                <span class="btn-icon"></span> Tap To Open Surprise <span class="btn-icon"></span>
            </button>
            <p class="start-hint">🔊 Turn on sound for best experience</p>
        </div>
    </div>

    
    <canvas id="tunnel-canvas"></canvas>

    
    <div id="cinematic-text">
        <span class="sub-line">✦ MY Spacial Person ✦</span>
        <span class="main-line">It's For You</span>
    </div>

    
    <div id="flash-overlay"></div>

    
    <div id="reveal">
        <canvas id="ambient-canvas"></canvas>

        <div class="reveal-content">
            <div class="reveal-card">

                <div class="reveal-item sparkle-row top">
                    <span>✦</span><span>·</span><span>✧</span><span>·</span><span>✦</span>
                </div>

                <h1 class="reveal-item reveal-title" id="display-title">Thanks<br>You Came</h1>

                <p class="reveal-item reveal-couple-name" id="display-couple"></p>

                <div class="reveal-item ornament">
                    <span class="orn-line"></span>
                    <span class="orn-diamond">◆</span>
                    <span class="orn-line"></span>
                </div>

                
                <div class="reveal-item polaroid-wrapper">
                    <div class="polaroid-frame" id="polaroid-box">
                        <div class="photo-placeholder">
                            <img id="couple-photo"
                                src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop"
                                alt="Our Moment" />
                            <div class="photo-overlay-btn" id="photo-upload-trigger">
                                <span>📷 Tap to change photo</span>
                            </div>
                        </div>
                        <p class="polaroid-caption" id="display-caption">Forever My Favorite Person 💕</p>
                    </div>
                    <input type="file" id="photo-file-input" accept="image/*" style="display:none;">
                </div>

                
                <div class="reveal-item big-heart-wrap">
                    <div class="heart-ring">
                        <span>♥</span><span>♥</span><span>♥</span><span>♥</span>
                        <span>♥</span><span>♥</span><span>♥</span><span>♥</span>
                    </div>
                    <div class="big-heart">❤</div>
                    <div class="heart-glow"></div>
                </div>

                <p class="reveal-item reveal-subtitle" id="display-subtitle">To Us & Your Beautiful Journey</p>


              <div class="reveal-item letter-btn-wrapper">
    <a href="brithday.html" class="glow-btn letter-open-btn">
        <span class="letter-icon">💌</span>
        Open Message
        <span class="letter-icon">💌</span>
    </a>
</div>

                <div class="reveal-item sparkle-row bottom">
                    <span>✧</span><span>·</span><span>♥</span><span>·</span><span>✧</span>
                </div>

            </div>
        </div>
    </div>
    <script src="script4.js"></script>
</body>

</html>>
